<div class="theatre-page">
	<header class="theatre-header">
		<div class="title">Select Seats</div>
		<div class="user">
			<div class="avatar" title="User">{{userName.charAt(0)}}</div>
		</div>
	</header>

	<div class="theatre-card">
		<div class="screen">SCREEN</div>

		<form class="seat-grid" aria-label="Select seats">
			<div *ngFor="let row of rows;let r = index" class="row">
				<div *ngFor="let seat of seats;let i = index" class="seat-container">
					<div type="button" [id]="row + seat" [ngClass]="userData?.seats.includes(row + seat) 
					|| (isconfirm && seatIds.includes(row + seat))? 'disabled' : 'seat-checkbox'"
						[class.selected]="seatIds.includes(row + seat)" (click)="isOccupied(r,i)">
						{{ row + seat }}
					</div>
				</div>
			</div>
		</form>

		<div class="controls">
			<div class="legend">
				<span class="box available"></span> Available
				<span class="box selected"></span> Selected
				<span class="box occupied"></span> Occupied
			</div>
			<button class="confirm" type="button" (click)="confirmSeats()">Confirm Selection</button>
		</div>
	</div>
</div>
