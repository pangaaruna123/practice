<div class="theatre-page">
	<header class="theatre-header">
		<div class="title">Select Seats</div>
		<div class="user">
			<div class="avatar" title="User">{{userName.charAt(0)}}</div>
		</div>
	</header>

	<div class="theatre-card">
		<div class="screen">SCREEN</div>

		<form class="seat-grid" aria-label="Select seats">

				<div *ngFor="let seat of seats;let i = index" class="seat-container">
					<div type="button" [id]="row + seat" class="seat-checkbox" (click)="isOccupied(r,i)">
						{{ row + seat }}
					</div>
					<!-- [class.selected]="isSelected(r,i)" -->
					<!-- <span
              class="seat"
              [class.occupied]="isOccupied(row, seat)"
            >
              {{ row + seat }}
		</span> -->
				</div>

			</div>
