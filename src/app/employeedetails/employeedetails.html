<mat-card class="table-data">
    <div class="header">
        <h3>Employees Details</h3>
        <button mat-raised-button (click)="addEmployee()">Add Employee</button>
    </div>
    <table mat-table [dataSource]="employeeData">
        <ng-container *ngFor="let item of columns" [matColumnDef]="item">
            <ng-container *ngIf="item !== 'actions'; else actionbtns">
                <th mat-header-cell *matHeaderCellDef>{{item}}</th>
                <td mat-cell *matCellDef=" let data">{{item.includes('date')?formateDate(data[item]):data[item]}}</td>
            </ng-container>
            <ng-template #actionbtns>
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let data" class="icons">
                     <mat-icon fontIcon="edit_square" (click)="editEmployee()"></mat-icon>
                    <mat-icon fontIcon="delete" (click)="deleteEmployee()"></mat-icon>
                </td>
            </ng-template>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
</mat-card>
