<div class="signup-page">

    <div class="signup-card">

        <h1>
            Travel Signup
        </h1>

        <p class="sub-title">
            Create your account and explore amazing destinations
        </p>

        <form
            [formGroup]="signupForm"
            (ngSubmit)="signup()"
        >

            <!-- USERNAME -->

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    formControlName="username"
                    placeholder="Enter username"
                />

                <div
                    class="error"
                    *ngIf="
                    signupForm.get('username')?.touched &&
                    signupForm.get('username')?.invalid
                    "
                >

                    <span
                        *ngIf="
                        signupForm.get('username')?.errors?.['required']
                        "
                    >
                        Username is required
                    </span>

                    <span
                        *ngIf="
                        signupForm.get('username')?.errors?.['minlength']
                        "
                    >
                        Minimum 3 characters required
                    </span>

                </div>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    formControlName="email"
                    placeholder="Enter email"
                />

                <div
                    class="error"
                    *ngIf="
                    signupForm.get('email')?.touched &&
                    signupForm.get('email')?.invalid
                    "
                >

                    <span
                        *ngIf="
                        signupForm.get('email')?.errors?.['required']
                        "
                    >
                        Email is required
                    </span>

                    <span
                        *ngIf="
                        signupForm.get('email')?.errors?.['email']
                        "
                    >
                        Enter valid email
                    </span>

                </div>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    formControlName="password"
                    placeholder="Enter password"
                />

                <div
                    class="error"
                    *ngIf="
                    signupForm.get('password')?.touched &&
                    signupForm.get('password')?.invalid
                    "
                >

                    <span
                        *ngIf="
                        signupForm.get('password')?.errors?.['required']
                        "
                    >
                        Password is required
                    </span>

                    <span
                        *ngIf="
                        signupForm.get('password')?.errors?.['minlength']
                        "
                    >
                        Minimum 6 characters required
                    </span>

                </div>

            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    formControlName="confirmPassword"
                    placeholder="Confirm password"
                />

                <div
                    class="error"
                    *ngIf="
                    signupForm.get('confirmPassword')?.touched &&
                    signupForm.get('confirmPassword')?.invalid
                    "
                >

                    <span
                        *ngIf="
                        signupForm.get('confirmPassword')?.errors?.['required']
                        "
                    >
                        Confirm password is required
                    </span>

                </div>

                <div
                    class="error"
                    *ngIf="
                    signupForm.errors?.['passwordMismatch'] &&
                    signupForm.get('confirmPassword')?.touched
                    "
                >
                    Passwords do not match
                </div>

            </div>

            <!-- BUTTON -->

            <button
                type="submit"
                [disabled]="signupForm.invalid"
            >
                Create Account
            </button>

        </form>

    </div>

</div>
